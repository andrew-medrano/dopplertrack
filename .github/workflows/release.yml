name: Release

# Push a tag like v0.4.0 (matching the version in pyproject.toml) to:
#   1. build the sdist and wheel,
#   2. create a GitHub Release with them attached.
# The PyPI job is kept from upstream but disabled: this fork would publish under
# upstream's package name "dopplertrack". Rename the package before enabling it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches pyproject version
        run: |
          v=$(uv version --short)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --dev && uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    if: false         # disabled on this fork, see the note at the top
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
